<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#263b35">
<title>أثر طيب لا يغيب | كريم الزياني</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;600;700&display=swap');
:root{--forest:#263b35;--forest2:#344b42;--gold:#c6a878;--gold2:#e4d3b2;--paper:#fbf8f1;--ink:#39473f;--muted:#7c8176;--line:#e8dfd0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 14px 34px;background:radial-gradient(ellipse at top,#52685b 0,#263b35 55%,#1d302b 100%);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;display:grid;place-items:center}
main{position:relative;overflow:hidden;width:min(100%,460px);background:var(--paper);border-radius:28px;padding:26px 23px 25px;box-shadow:0 24px 70px #0c1b17a8;border:1px solid #d8c39d}
main:before{content:"";position:absolute;inset:9px;border:1px solid #d8c39d;border-radius:21px;pointer-events:none}
main:after{content:"";position:absolute;top:-64px;left:-64px;width:170px;height:170px;border:1px solid #d9c7a5;border-radius:50%;opacity:.35;pointer-events:none}
header{position:relative;z-index:1;text-align:center;padding:15px 6px 19px}
.ornament{color:var(--gold);font-size:32px;line-height:1}
.kicker{font-size:12px;letter-spacing:2px;color:#8d806a;margin:9px 0 3px}
h1{font-family:'Amiri',serif;font-size:35px;line-height:1.35;color:var(--forest);margin:0;font-weight:700}
.subtitle{color:#8a806f;font-size:15px;margin:2px 0 0}
.name-card{position:relative;z-index:1;margin:4px 0 17px;padding:18px 12px 16px;text-align:center;background:linear-gradient(135deg,#f2eadb,#faf6ed);border:1px solid #e3d5bc;border-radius:18px}
.name-label{font-size:12px;color:#8b806e;margin-bottom:5px}
.name{font-family:'Amiri',serif;font-size:31px;font-weight:700;color:#69583f;line-height:1.55}
.name-ornament{color:#b69a6c;font-size:18px;letter-spacing:8px}
.prayer{position:relative;z-index:1;text-align:center;font-family:'Amiri',serif;font-size:20px;line-height:1.9;color:#77705f;margin:8px 8px 19px}
.divider{height:1px;background:linear-gradient(90deg,transparent,#d8c6a5,transparent);margin:17px 0 19px}
label{display:block;text-align:right;font-size:14px;font-weight:600;color:#77705f;margin:13px 2px 7px}
select{width:100%;padding:13px 14px;border:1px solid #ded4c3;border-radius:13px;background:#fffdf9;color:#4d574e;font:500 16px 'Tajawal',sans-serif;outline:none}
.counter-wrap{text-align:center;padding:13px 0 3px}
.count{font-size:65px;font-weight:600;line-height:1.15;color:var(--forest);font-variant-numeric:tabular-nums}
.goal{font-size:13px;color:#938873;margin-top:4px}
.progress{height:6px;background:#eee7db;border-radius:99px;overflow:hidden;margin:14px 0 8px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#a88d60,#d3bb8d);transition:width .2s}
.tap{width:142px;height:142px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#52695b,#263b35 72%);color:#fff8e9;font:700 25px 'Amiri',serif;margin:15px auto 12px;border:5px solid #e8ddc9;outline:1px solid #b99d6e;box-shadow:0 10px 24px #263b3533;display:grid;place-items:center;cursor:pointer;transition:transform .12s}
.tap:active{transform:scale(.96)}
.done{min-height:22px;color:#667d65;font-size:14px;margin-top:5px}
.actions{display:flex;gap:10px;margin-top:8px}
.actions button{flex:1;padding:11px;border:1px solid #ded4c3;border-radius:12px;background:#fffdf9;color:#655b4b;font:500 14px 'Tajawal',sans-serif;cursor:pointer}
footer{position:relative;z-index:1;text-align:center;border-top:1px solid #e8dfd0;margin-top:21px;padding:16px 8px 0;color:#827764;font-family:'Amiri',serif;font-size:18px;line-height:1.85}
.footer-mark{color:#b99b6b;font-size:20px}
@media(max-width:360px){h1{font-size:30px}.name{font-size:27px}.prayer{font-size:18px}}
</style>
</head>
<body>
<main>
<header>
  <div class="ornament">❧</div>
  <div class="kicker">ذِكْرٌ وَدُعَاء</div>
  <h1>أثرٌ طيّب لا يغيب</h1>
  <p class="subtitle">ذكرٌ يبقى، ودعاءٌ يصل بإذن الله</p>
</header>
<section class="name-card">
  <div class="name-label">إهداء إلى ذكرى</div>
  <div class="name">المرحوم كريم زياني</div>
  <div class="name-ornament">۞ ❀ ۞</div>
</section>
<p class="prayer">اللهم اغفر له وارحمه، وأنر قبره، وآنس وحشته، واجعل الجنة داره ومأواه.</p>
<div class="divider"></div>
<label for="zikr">اختاري الذكر</label>
<select id="zikr">
<option>أستغفر الله</option><option>سبحان الله</option><option>الحمد لله</option>
<option>لا إله إلا الله</option><option>الله أكبر</option><option>سبحان الله وبحمده</option>
</select>
<label for="goal">عدد التسبيحات</label>
<select id="goal"><option value="33">33 تسبيحة</option><option value="100">100 تسبيحة</option><option value="0">بدون حد</option></select>
<div class="counter-wrap">
  <div class="count" id="count">0</div>
  <div class="goal" id="goalText">من 33</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <button class="tap" id="tap" type="button">سبّحي</button>
  <div class="done" id="done" aria-live="polite"></div>
</div>
<div class="actions">
<button id="undo" type="button">تراجع</button>
<button id="reset" type="button">إعادة العدّ</button>
</div>
<footer><div class="footer-mark">✧</div>اللهم اجعل له من كل دعاء رحمة، ومن كل استغفار مغفرة، ومن كل خير نصيباً.<br>رحمه الله رحمةً واسعة.</footer>
</main>
<script>
let count=0;const $=id=>document.getElementById(id);
function render(){const goal=Number($('goal').value);$('count').textContent=count;$('goalText').textContent=goal?`من ${goal}`:'تسبيح مفتوح';$('bar').style.width=goal?`${Math.min(100,count/goal*100)}%`:'0%';$('done').textContent=goal&&count>=goal?'اكتمل العدد، تقبّل الله منكِ 🤍':'';}
$('tap').addEventListener('click',()=>{count++;render()});
$('undo').addEventListener('click',()=>{count=Math.max(0,count-1);render()});
$('reset').addEventListener('click',()=>{count=0;render()});
$('goal').addEventListener('change',render);render();
</script>
</body>
</html>
